<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta - Amigurumis</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/usuario-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div id="usuario-container" style="display: none;">
        <header class="header">
            <div class="nav-left">
                <h2>Mi Perfil</h2>
            </div>
            <div class="nav-center">
                <img src="../assets/img/logo.png" alt="Logo" class="logo">
            </div>
            <div class="nav-right">
                <a href="../index.html" class="nav-btn" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center;">
                    <i class="fa-solid fa-store" style="margin-right: 5px;"></i> Ir a Tienda
                </a>
                <button id="btn-logout" class="nav-btn">Cerrar Sesión</button>
            </div>
        </header>

        <main class="usuario-main">
            <!-- SECCIÓN 1: DATOS DEL USUARIO -->
            <section class="usuario-card perfil-info">
                <div class="avatar-icon"><i class="fa-solid fa-user-circle"></i></div>
                <div>
                    <h3 id="user-nombre">Cargando...</h3>
                    <p id="user-email">email@ejemplo.com</p>
                </div>
            </section>

            <!-- SECCIÓN 2: CARRITO DE COMPRAS -->
            <section class="usuario-section">
                <h3><i class="fa-solid fa-cart-shopping"></i> Mi Carrito de Compras</h3>
                <div id="lista-carrito" class="usuario-grid">
                    <p>Cargando carrito...</p>
                </div>
                <div id="carrito-resumen" class="resumen-total"></div>
            </section>

            <!-- SECCIÓN 3: LISTA DE DESEOS / FAVORITOS -->
            <section class="usuario-section">
                <h3><i class="fa-solid fa-heart"></i> Mi Lista de Deseos</h3>
                <div id="lista-favoritos" class="usuario-grid">
                    <p>Cargando favoritos...</p>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="../assets/js/usuario.js"></script>
</body>
</html>
